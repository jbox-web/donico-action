# Per-task `timeout` keys are only enforced reliably from mise 2026.10.2 on:
# an older mise must refuse to run instead of leaving those tasks unbounded.
min_version = "2026.10.2"

[tools]
action-validator = "0.9.0"
actionlint = "1.7.12"
bats = "1.14.0"
# The scripts and their tests run jq: pinned here so that `mise run` puts the
# binary itself on the PATH, never a shim the job directory cannot resolve.
jq = "1.8.2"
shellcheck = "0.11.0"

[tasks."dev:test"]
description = "Run the bats tests of the action scripts"
timeout = "300s"
run = "bats --recursive test"

[tasks."dev:lint"]
description = "Check the scripts and their tests (shellcheck), the actions (action-validator) and the workflows (actionlint)"
timeout = "120s"
# bash, not the sh mise uses by default: the glob below needs globstar
shell = "bash -c"
run = '''
set -o errexit -o nounset -o pipefail
shopt -s globstar nullglob
shellcheck --shell=bash scripts/*.sh test/**/*.bash test/**/*.bats test/stubs/*
action-validator action.yml cleanup/action.yml
actionlint
'''
